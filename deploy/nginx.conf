# Nginx reverse proxy for KonkanTech Manager
# Install: sudo cp deploy/nginx.conf /etc/nginx/sites-available/konkantech
#          sudo ln -s /etc/nginx/sites-available/konkantech /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# Then get HTTPS: sudo certbot --nginx -d konkantechnologies.in -d www.konkantechnologies.in

server {
    listen 80;
    server_name konkantechnologies.in www.konkantechnologies.in;

    client_max_body_size 16M;   # matches app MAX_CONTENT_LENGTH (file uploads)

    # Serve uploaded files / static directly if you keep them on disk
    location /static/ {
        alias /var/www/konkantech/static/;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
