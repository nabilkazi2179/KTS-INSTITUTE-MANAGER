{% extends 'base.html' %}
{% block title %}{{ code }} — {{ title }}{% endblock %}
{% block content %}
<div class="card" style="max-width:640px;margin:40px auto;text-align:center;padding:40px 28px">
  <div style="font-size:4rem;font-weight:700;opacity:.15;line-height:1">{{ code }}</div>
  <h2 style="margin:10px 0 8px">{{ title }}</h2>
  <p style="opacity:.75;margin-bottom:22px">{{ message }}</p>
  {% if detail %}
  <details style="text-align:left;margin:18px 0">
    <summary style="cursor:pointer;font-size:.85rem;opacity:.7">Technical details (development only)</summary>
    <pre style="background:#f5f5f5;padding:12px;font-size:11px;overflow:auto;border-radius:6px;max-height:340px">{{ detail }}</pre>
  </details>
  {% endif %}
  <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
    <a href="{{ url_for('dashboard') }}" class="btn">Go to Dashboard</a>
    <a href="javascript:history.back()" class="btn btn-outline">Go Back</a>
  </div>
</div>
{% endblock %}
