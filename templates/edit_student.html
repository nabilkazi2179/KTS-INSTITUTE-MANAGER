{% extends "base.html" %}
{% block title %}Edit Student{% endblock %}
{% block content %}
<div class="card">
  <div class="card-title">&#9998; Edit Student - {{ student.student_id }}</div>
  <form method="POST">
    <div class="form-grid">
      <div class="fg"><label>Full Name</label><input type="text" name="full_name" value="{{ student.full_name }}" required></div>
      <div class="fg"><label>Guardian Name</label><input type="text" name="guardian_name" value="{{ student.guardian_name or '' }}"></div>
      <div class="fg"><label>DOB</label><input type="date" name="dob" value="{{ student.dob or '' }}"></div>
      <div class="fg"><label>Gender</label><select name="gender"><option value="">Select</option><option {% if student['gender']=='Male' %}selected{% endif %}>Male</option><option {% if student['gender']=='Female' %}selected{% endif %}>Female</option><option {% if student['gender']=='Other' %}selected{% endif %}>Other</option></select></div>
      <div class="fg"><label>Mobile</label><input type="text" name="mobile" value="{{ student.mobile or '' }}"></div>
      <div class="fg"><label>WhatsApp</label><input type="text" name="whatsapp" value="{{ student.whatsapp or '' }}"></div>
      <div class="fg"><label>Email</label><input type="email" name="email" value="{{ student.email or '' }}"></div>
      <div class="fg"><label>Qualification</label><input type="text" name="qualification" value="{{ student.qualification or '' }}"></div>
      <div class="fg"><label>City</label><input type="text" name="city" value="{{ student.city or '' }}"></div>
      <div class="fg"><label>State</label><input type="text" name="state" value="{{ student.state or '' }}"></div>
      <div class="fg"><label>Country</label><input type="text" name="country" value="{{ student.country or 'India' }}"></div>
      <div class="fg"><label>Batch</label>
        <select name="batch_id"><option value="">Select</option>
          {% for b in batches %}<option value="{{ b.id }}" {% if student['batch_id']==b['id'] %}selected{% endif %}>{{ b.batch_name }} ({{ b.course_name }})</option>{% endfor %}
        </select>
      </div>
      <div class="fg"><label>Counselor</label>
        <select name="counselor_id"><option value="">Select</option>
          {% for c in counselors %}<option value="{{ c.id }}" {% if student['counselor_id']==c['id'] %}selected{% endif %}>{{ c.full_name }}</option>{% endfor %}
        </select>
      </div>
      <div class="fg"><label>Status</label><select name="status">
        <option value="active" {% if student['status']=='active' %}selected{% endif %}>Active</option>
        <option value="inactive" {% if student['status']=='inactive' %}selected{% endif %}>Inactive</option>
      </select></div>
      <div class="fg" style="grid-column:1/-1"><label>Remarks</label><textarea name="remarks">{{ student.remarks or '' }}</textarea></div>
    </div>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button type="submit" class="btn btn-primary">&#128194; Save Changes</button>
      <a href="{{url_for('view_student',id=student['id'])}}" class="btn btn-outline">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
