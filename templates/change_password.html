{% extends 'base.html' %}
{% block title %}Change Password{% endblock %}
{% block content %}
<div class="card" style="max-width:460px;margin:30px auto;padding:28px">
  <h3 style="margin-top:0">&#128273; Change Password</h3>
  <p style="opacity:.7;font-size:.85rem">Choose a strong password of at least 8 characters.</p>
  <form method="POST">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
    <label style="display:block;margin:12px 0 4px;font-size:.85rem">Current password</label>
    <input type="password" name="current_password" required autocomplete="current-password"
           style="width:100%;padding:9px;border:1px solid #ddd;border-radius:6px">
    <label style="display:block;margin:12px 0 4px;font-size:.85rem">New password</label>
    <input type="password" name="new_password" required minlength="8" autocomplete="new-password"
           style="width:100%;padding:9px;border:1px solid #ddd;border-radius:6px">
    <label style="display:block;margin:12px 0 4px;font-size:.85rem">Confirm new password</label>
    <input type="password" name="confirm_password" required minlength="8" autocomplete="new-password"
           style="width:100%;padding:9px;border:1px solid #ddd;border-radius:6px">
    <button class="btn" style="margin-top:18px;width:100%">Update Password</button>
  </form>
</div>
{% endblock %}
